<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#12110f">
  <title>MDC HUB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="booting">
  <div class="intro" id="intro">
    <div class="intro-name" id="intro-name">
      <span class="word mdc">MDC</span>
      <span class="word hub">HUB</span>
    </div>
  </div>

  <header class="top">
    <a class="brand" href="#top">MDC HUB</a>
    <button class="menu-btn" id="menu-btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <aside class="menu" id="menu">
    <button class="menu-item from-left" data-panel="install">Install app</button>
    <button class="menu-item from-right" data-panel="upload">Upload file</button>
    <button class="menu-item from-left" data-panel="about">About</button>
  </aside>

  <section class="panel" id="panel">
    <button class="panel-close" id="panel-close">Close</button>
    <div class="panel-page" id="install">
      <h2>Install app</h2>
      <p>Add MDC HUB to Chrome like an app.</p>
      <button id="install-app">Install</button>
      <p id="install-msg">Open this page in Chrome, then press Install.</p>
    </div>
    <div class="panel-page" id="upload">
      <h2>Upload file</h2>
      <form id="form">
        <input name="key" type="password" placeholder="Upload key" required>
        <input name="note" type="text" placeholder="Description" maxlength="120">
        <input name="file" type="file" required>
        <button>Upload</button>
        <p id="msg"></p>
      </form>
    </div>
    <div class="panel-page" id="about">
      <h2>About</h2>
      <p>MDC HUB is a simple public shelf. What is uploaded here is visible to anyone with the link.</p>
    </div>
  </section>

  <main id="top">
    <section class="files" id="files">
      <div class="section-head">
        <h2>Files</h2>
        <p id="count">Loading</p>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer>
    <span>MDC HUB</span>
  </footer>
  <aside class="discord-pop" id="discord-pop">
    <p>Join my Discord server</p>
    <div class="pop-actions">
      <a class="join" href="https://discord.gg/6ETYaxeSTU" target="_blank" rel="noopener">Join</a>
      <button type="button" id="close-pop" aria-label="Close">×</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
