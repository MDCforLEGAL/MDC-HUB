<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12110f">
  <title>MDC HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="intro" id="intro">
    <div class="intro-name">
      <span class="word">MDC</span>
      <span class="word">HUB</span>
    </div>
  </div>

  <header class="top">
    <a class="brand" href="#top">MDC HUB</a>
    <nav>
      <a href="#files">Files</a>
      <a href="#upload">Upload</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow">Public files</p>
      <h1>MDC HUB</h1>
      <p class="lead">Files I share. Open to everyone.</p>
      <a class="cta" href="#files">Browse files</a>
    </section>

    <section class="files" id="files">
      <div class="section-head">
        <h2>Files</h2>
        <p id="count">Loading</p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="upload" id="upload">
      <h2>Upload</h2>
      <form id="form">
        <input name="key" type="password" placeholder="Upload key" required>
        <input name="file" type="file" required>
        <button>Upload</button>
        <p id="msg"></p>
      </form>
    </section>

    <section class="about" id="about">
      <h2>About</h2>
      <p>MDC HUB is a simple public shelf. What is uploaded here is visible to anyone with the link.</p>
    </section>
  </main>

  <footer>
    <span>MDC HUB</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
